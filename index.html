<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Schependomlaan Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; overflow: hidden; font-family: sans-serif; }
    #canvas { width: 100vw; height: 100vh; }

    #toolbar {
      position: absolute;
      top: 12px; left: 12px;
      display: flex; gap: 8px; flex-wrap: wrap;
      z-index: 10;
    }
    button {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.15s;
    }
    button:hover { background: rgba(255,255,255,0.22); }
    button.active { background: rgba(99,179,237,0.35); border-color: #63b3ed; }

    #status {
      position: absolute;
      bottom: 12px; left: 12px;
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      pointer-events: none;
    }

    #controls-hint {
      position: absolute;
      bottom: 28px; right: 120px;
      color: rgba(255,255,255,0.3);
      font-size: 10px;
      text-align: right;
      line-height: 1.6;
      pointer-events: none;
    }

    #legend {
      position: absolute;
      top: 12px; right: 12px;
      display: none;
      flex-direction: column;
      gap: 4px;
      background: rgba(0,0,0,0.5);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 11px;
      backdrop-filter: blur(4px);
    }
    #legend.visible { display: flex; }

    #nav-cube {
      position: absolute;
      bottom: 12px; right: 12px;
      width: 100px; height: 100px;
      z-index: 10;
    }

    #views-dropdown { display: inline-flex; }
    #views-dropdown select {
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      outline: none;
    }
    #views-dropdown select option { background: #1a1a2e; color: #fff; }

    /* ── Isolate nav bar ──────────────────────────────────────────────── */
    #isolate-bar {
      display: none;
      position: absolute;
      bottom: 48px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 6px 14px;
      color: #fff;
      font-size: 12px;
      gap: 12px;
      align-items: center;
      backdrop-filter: blur(6px);
      z-index: 20;
    }
    #isolate-bar.visible { display: flex; }
    #isolate-bar button {
      background: none; border: none;
      font-size: 16px; padding: 0 4px;
      cursor: pointer; color: #fff;
    }
    #isolate-bar button:hover { color: #63b3ed; background: none; }

    #meta-canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 20;
    }

    /* ── Book popup ────────────────────────────────────────────────────── */
    #book-popup {
      position: absolute;
      z-index: 30;
      display: none;
      cursor: pointer;
      /* centred on the element — JS sets left/top */
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.7));
    }
    #book-popup.visible { display: block; }

    /* closed = just the cover, a tall narrow book */
    .book-cover {
      width: 124px;
      height: 174px;
      background: linear-gradient(150deg, #1e3354 0%, #0d1a2e 60%, #091525 100%);
      border: 2px solid rgba(99,179,237,0.45);
      border-left: 6px solid #06101e;
      border-radius: 2px 10px 10px 2px;
      /* layered shadows: hard spine edge + outer glow + inner depth */
      box-shadow:
        -7px 2px 0 #040c16,
        -10px 4px 12px rgba(0,0,0,0.6),
        inset -8px 0 18px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 14px 16px 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.35s ease;
      /* subtle resting tilt — feels physical */
      perspective: 600px;
      transform: perspective(600px) rotateY(-4deg);
    }
    .book-cover:hover {
      transform: perspective(600px) rotateY(-1deg) scale(1.035);
      box-shadow:
        -7px 2px 0 #040c16,
        -10px 4px 18px rgba(0,0,0,0.65),
        inset -8px 0 18px rgba(0,0,0,0.55),
        0 0 22px rgba(99,179,237,0.3);
    }
    .book-cover.closing {
      opacity: 0;
      transform: perspective(600px) rotateY(-85deg) scale(0.9);
      pointer-events: none;
    }
    /* decorative spine ribbon */
    .book-cover::before {
      content: "";
      position: absolute;
      left: -4px; top: 20px; bottom: 20px;
      width: 3px;
      background: linear-gradient(to bottom, transparent, rgba(99,179,237,0.4), transparent);
      border-radius: 2px;
    }
    /* top edge highlight */
    .book-cover::after {
      content: "";
      position: absolute;
      top: 0; left: 6px; right: 0;
      height: 2px;
      background: linear-gradient(to right, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      border-radius: 0 10px 0 0;
    }
    .cover-icon { font-size: 26px; opacity: 0.88; }
    .cover-type {
      font-size: 13px; font-weight: 700;
      color: #ffe066; text-align: center;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      line-height: 1.3;
    }
    .cover-floor {
      font-size: 10px; color: rgba(255,255,255,0.5);
      text-align: center; letter-spacing: 0.06em;
    }
    .cover-hint {
      font-size: 9px; color: rgba(255,255,255,0.25);
      margin-top: 4px; letter-spacing: 0.05em;
    }

    /* open spread — wraps both pages, animates open from spine */
    .book-spread {
      display: none;
      width: 320px;
      height: 200px;
      position: relative;
      perspective: 900px;
      transform-style: preserve-3d;
    }
    .book-spread.visible { display: block; }
    /* the inner container that actually rotates open */
    .spread-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-origin: left center;
      transform: rotateY(-90deg);
      transition: transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .spread-inner.open  { transform: rotateY(0deg); }
    .spread-inner.close { transform: rotateY(-90deg); }

    /* left + right page halves */
    .book-page {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: #f5f0e8;
      padding: 14px 12px 10px;
      overflow: hidden;
      box-sizing: border-box;
    }
    .book-page.left {
      left: 0;
      border-radius: 10px 0 0 10px;
      border-right: none;
      background: linear-gradient(to right, #ede8df, #f5f0e8);
      box-shadow: inset -4px 0 8px rgba(0,0,0,0.12), -2px 0 8px rgba(0,0,0,0.3);
    }
    .book-page.right {
      right: 0;
      border-radius: 0 10px 10px 0;
      border-left: none;
      background: linear-gradient(to left, #ede8df, #f5f0e8);
      box-shadow: inset 4px 0 8px rgba(0,0,0,0.12), 2px 0 8px rgba(0,0,0,0.3);
    }
    /* spine shadow */
    .book-spine {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 6px;
      height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.25), rgba(0,0,0,0.05), rgba(0,0,0,0.25));
      z-index: 2;
      pointer-events: none;
    }

    /* click zones — transparent overlays on each page half */
    .book-click-left, .book-click-right {
      position: absolute;
      top: 0; width: 50%; height: 100%;
      z-index: 5;
      cursor: pointer;
    }
    .book-click-left  { left: 0; }
    .book-click-right { right: 0; }

    /* page content typography */
    .page-section-title {
      font-size: 8px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: #3b6fbf; margin-bottom: 6px;
      border-bottom: 1px solid rgba(59,111,191,0.25);
      padding-bottom: 3px;
    }
    .page-row {
      display: flex; justify-content: space-between;
      font-size: 9.5px; line-height: 1.6;
      color: #1a1a2e;
    }
    .page-row .lbl { color: #5a6e8a; flex-shrink: 0; margin-right: 6px; }
    .page-row .val { color: #0d1a2e; font-weight: 600; text-align: right; }
    .page-row.hero {
      font-size: 12px; font-weight: 700;
      color: #1a1a2e; justify-content: center;
      margin-bottom: 4px;
    }
    .page-row.sub {
      font-size: 9px; color: #5a6e8a;
      justify-content: center; margin-bottom: 8px;
    }
    .page-row.sep {
      border-bottom: 1px solid rgba(0,0,0,0.1);
      margin: 4px 0;
    }

    /* page number dots */
    .page-dots {
      position: absolute;
      bottom: 6px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 5px;
      z-index: 6; pointer-events: none;
    }
    .page-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(0,0,0,0.18);
      transition: background 0.2s;
    }
    .page-dot.active { background: #3b6fbf; }

    /* flip animation */
    .book-flipper {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      z-index: 4;
      pointer-events: none;
      transition: transform 0.45s cubic-bezier(0.645, 0.045, 0.355, 1.000);
    }
    .book-flipper.flip-right { transform: rotateY(-180deg); }
    .flipper-face {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      backface-visibility: hidden;
      background: #f5f0e8;
      padding: 14px 12px 10px;
      box-sizing: border-box;
      overflow: hidden;
    }
    .flipper-face.back {
      transform: rotateY(180deg);
      background: linear-gradient(to left, #ede8df, #f5f0e8);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <canvas id="nav-cube"></canvas>

  <div id="toolbar">
    <button id="btn-reset">Reset view</button>
    <button id="btn-xray">X-ray</button>
    <button id="btn-isolate">Zoom to selected</button>
    <button id="btn-see-groups" style="display:none;">See groups</button>
    <button id="btn-showall">Show all</button>
    <div id="views-dropdown"><select id="view-select">
      <option value="" disabled selected>📷 Preset views</option>
      <option value="overview">Overview</option>
      <option value="front">Front</option>
      <option value="back">Back</option>
      <option value="left">Left side</option>
      <option value="right">Right side</option>
      <option value="top">Top (plan)</option>
      <option value="roof">Roof closeup</option>
      <option value="ground">Ground floor</option>
    </select></div>
  </div>

  <!-- Isolate nav: scroll through selected elements / groups -->
  <div id="isolate-bar">
    <span id="nav-arrows" style="display:none;align-items:center;gap:8px;">
      <button id="nav-prev">◀</button>
      <span id="nav-label">1 / 1</span>
      <button id="nav-next">▶</button>
    </span>
  </div>

  <canvas id="meta-canvas"></canvas>

  <!-- Book popup -->
  <div id="book-popup">
    <!-- CLOSED: cover -->
    <div class="book-cover" id="book-cover">
      <div class="cover-icon">📖</div>
      <div class="cover-type" id="cover-type">Element</div>
      <div class="cover-floor" id="cover-floor">—</div>
      <div class="cover-hint">tap to open</div>
    </div>
    <!-- OPEN: spread -->
    <div class="book-spread" id="book-spread">
      <div class="spread-inner" id="spread-inner">
        <div class="book-page left"  id="book-left-page"></div>
        <div class="book-spine"></div>
        <div class="book-page right" id="book-right-page"></div>
        <!-- animated flipping half -->
        <div class="book-flipper" id="book-flipper">
          <div class="flipper-face front" id="flipper-front"></div>
          <div class="flipper-face back"  id="flipper-back"></div>
        </div>
        <div class="book-click-left"  id="book-click-left"></div>
        <div class="book-click-right" id="book-click-right"></div>
        <div class="page-dots" id="page-dots"></div>
      </div>
    </div>
  </div>

  <div id="legend"></div>
  <div id="status">Loading model…</div>
  <div id="controls-hint">
    Left drag — rotate &nbsp;|&nbsp; Right drag — pan<br>
    Scroll — zoom &nbsp;|&nbsp; Click — toggle select
  </div>

  <script type="module">
    import {
      Viewer,
      XKTLoaderPlugin,
      NavCubePlugin
    } from "https://cdn.jsdelivr.net/npm/@xeokit/xeokit-sdk/dist/xeokit-sdk.min.es.js";

    // CAM_D — camera distance for all views (lower = closer). index.html ~line 164
    const CAM_D = 0.6;

    // ── Viewer setup ──────────────────────────────────────────────────────────
    const viewer = new Viewer({
      canvasId: "canvas",
      transparent: false,
      backgroundColor: [0.105, 0.105, 0.18]
    });

    viewer.camera.eye  = [-30*CAM_D, 10+30*CAM_D, 60*CAM_D];
    viewer.camera.look = [0, 10, 0];
    viewer.camera.up   = [0, 1, 0];

    // ── 2D canvas text — rendered directly on element ────────────────────────
    const metaCanvas = document.getElementById("meta-canvas");
    const ctx2d      = metaCanvas.getContext("2d");
    let metaLines    = null;   // [{label, value}] to draw
    let metaWorldPos = null;
    let metaRafId    = null;

    function resizeMetaCanvas() {
      metaCanvas.width  = metaCanvas.offsetWidth;
      metaCanvas.height = metaCanvas.offsetHeight;
    }
    resizeMetaCanvas();
    window.addEventListener("resize", resizeMetaCanvas);

    function projectToScreen(worldPos) {
      const vm = viewer.camera.viewMatrix;
      const pm = viewer.camera.projMatrix;
      const [wx, wy, wz] = worldPos;
      const vx = vm[0]*wx + vm[4]*wy + vm[8]*wz  + vm[12];
      const vy = vm[1]*wx + vm[5]*wy + vm[9]*wz  + vm[13];
      const vz = vm[2]*wx + vm[6]*wy + vm[10]*wz + vm[14];
      const vw = vm[3]*wx + vm[7]*wy + vm[11]*wz + vm[15];
      const cx = pm[0]*vx + pm[4]*vy + pm[8]*vz  + pm[12]*vw;
      const cy = pm[1]*vx + pm[5]*vy + pm[9]*vz  + pm[13]*vw;
      const cw = pm[3]*vx + pm[7]*vy + pm[11]*vz + pm[15]*vw;
      if (Math.abs(cw) < 1e-6) return null;
      return [
        (cx / cw + 1) * 0.5 * metaCanvas.width,
        (-cy / cw + 1) * 0.5 * metaCanvas.height,
      ];
    }

    // ── Book popup ────────────────────────────────────────────────────────────
    const bookPopup     = document.getElementById("book-popup");
    const bookCover     = document.getElementById("book-cover");
    const bookSpread    = document.getElementById("book-spread");
    const bookLeft      = document.getElementById("book-left-page");
    const bookRight     = document.getElementById("book-right-page");
    const bookFlipper   = document.getElementById("book-flipper");
    const flipperFront  = document.getElementById("flipper-front");
    const flipperBack   = document.getElementById("flipper-back");
    const pageDots      = document.getElementById("page-dots");

    let bookPages    = [];   // array of {left, right} HTML strings per spread
    let bookSpreadIdx = 0;
    let bookOpen     = false;
    let bookFlipping = false;

    function pageRow(label, value) {
      if (!value || value === "—" || value === "0") return "";
      return `<div class="page-row"><span class="lbl">${label}</span><span class="val">${value}</span></div>`;
    }

    function buildBookPages(data) {
      // data: { constructionType, floor, apartment, schedRows, statRows, costRows }
      const { constructionType, floor, apartment, schedRows, statRows, costRows } = data;

      // Page 0 left: identity hero
      const p0left = `
        <div class="page-row hero">${constructionType}</div>
        <div class="page-row sub">${floor}</div>
        <div class="page-row sub" style="margin-top:-6px">${apartment}</div>
      `;
      // Page 0 right: schedule data
      const schedHtml = schedRows.map(r => r.label ? pageRow(r.label, r.value) : `<div class="page-row sub">${r.value}</div>`).join("");
      const p0right = schedHtml
        ? `<div class="page-section-title">Schedule</div>${schedHtml}`
        : `<div class="page-row sub" style="margin-top:30px;color:#aaa">No schedule data</div>`;

      bookPages = [{ left: p0left, right: p0right }];

      // Page 1: stat + cost if any
      const statHtml = statRows.map(r => pageRow(r.label, r.value)).join("");
      const costHtml = costRows.map(r => r.label ? pageRow(r.label, r.value) : `<div class="page-row sub">${r.value}</div>`).join("");
      if (statHtml || costHtml) {
        const p1left  = statHtml ? `<div class="page-section-title">Details</div>${statHtml}` : "";
        const p1right = costHtml ? `<div class="page-section-title">Cost</div>${costHtml}` : "";
        bookPages.push({ left: p1left, right: p1right });
      }
    }

    function renderDots() {
      pageDots.innerHTML = bookPages.map((_, i) =>
        `<div class="page-dot${i === bookSpreadIdx ? " active" : ""}"></div>`
      ).join("");
    }

    function setSpread(idx) {
      const p = bookPages[idx];
      bookLeft.innerHTML  = p.left;
      bookRight.innerHTML = p.right;
      renderDots();
    }

    const spreadInner = document.getElementById("spread-inner");

    function openBook() {
      bookOpen = true;
      bookSpreadIdx = 0;
      setSpread(0);

      // Cover fades/rotates away, spread swings open
      bookCover.classList.add("closing");
      bookSpread.classList.add("visible");

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          spreadInner.classList.add("open");
          spreadInner.classList.remove("close");
        });
      });

      bookCover.addEventListener("transitionend", function handler() {
        bookCover.removeEventListener("transitionend", handler);
        bookCover.style.display = "none";
        bookCover.classList.remove("closing");
      }, { once: true });
    }

    function closeBook() {
      bookOpen = false;
      bookFlipper.classList.remove("flip-right");
      bookFlipper.style.display = "none";

      // Swing closed then show cover
      spreadInner.classList.remove("open");
      spreadInner.classList.add("close");

      spreadInner.addEventListener("transitionend", function handler() {
        spreadInner.removeEventListener("transitionend", handler);
        bookSpread.classList.remove("visible");
        bookCover.style.display = "";
      }, { once: true });
    }

    function flipTo(nextIdx) {
      if (bookFlipping) return;
      const p = bookPages[nextIdx];

      // Front of flipper = current right page; back = next left page
      flipperFront.innerHTML = bookRight.innerHTML;
      flipperBack.innerHTML  = p.left;
      bookFlipper.style.left = "50%";
      bookFlipper.style.transformOrigin = "left center";
      bookFlipper.style.display = "block";
      bookFlipper.classList.remove("flip-right");

      // Pre-load new right page behind, new left stays as-is until flip halfway
      bookRight.innerHTML = p.right;

      bookFlipping = true;
      // Small delay so browser renders the initial state before animating
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          bookFlipper.classList.add("flip-right");
        });
      });

      bookFlipper.addEventListener("transitionend", function handler() {
        bookFlipper.removeEventListener("transitionend", handler);
        bookLeft.innerHTML = p.left;
        bookFlipper.style.display = "none";
        bookFlipper.classList.remove("flip-right");
        bookSpreadIdx = nextIdx;
        renderDots();
        bookFlipping = false;
      }, { once: true });
    }

    function flipBackTo(prevIdx) {
      if (bookFlipping) return;
      const p = bookPages[prevIdx];

      // Left half lifts and swings toward the spine (right edge) — opposite of forward flip
      flipperFront.innerHTML = bookLeft.innerHTML; // front = current left page
      flipperBack.innerHTML  = p.right;             // back  = previous right page
      bookFlipper.style.left            = "0";
      bookFlipper.style.transformOrigin = "right center";
      bookFlipper.style.display         = "block";

      // Start flat (front visible), animate to fully rotated (back = prev right visible)
      bookFlipper.style.transition = "none";
      bookFlipper.style.transform  = "rotateY(0deg)";
      bookLeft.innerHTML = p.left; // prev left sits underneath, revealed after animation

      bookFlipping = true;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          bookFlipper.style.transition = "transform 0.45s cubic-bezier(0.645, 0.045, 0.355, 1.000)";
          bookFlipper.style.transform  = "rotateY(180deg)";
        });
      });

      bookFlipper.addEventListener("transitionend", function handler() {
        bookFlipper.removeEventListener("transitionend", handler);
        bookRight.innerHTML = p.right;
        bookFlipper.style.display    = "none";
        bookFlipper.style.transition = "";
        bookFlipper.style.transform  = "";
        bookSpreadIdx = prevIdx;
        renderDots();
        bookFlipping = false;
      }, { once: true });
    }

    // Click cover → open
    bookCover.addEventListener("click", (e) => {
      e.stopPropagation();
      openBook();
    });

    // Click right half → next spread / stay on last
    document.getElementById("book-click-right").addEventListener("click", (e) => {
      e.stopPropagation();
      const next = bookSpreadIdx + 1;
      if (next < bookPages.length) flipTo(next);
    });

    // Click left half → prev spread or close
    document.getElementById("book-click-left").addEventListener("click", (e) => {
      e.stopPropagation();
      const prev = bookSpreadIdx - 1;
      if (prev >= 0) flipBackTo(prev);
      else closeBook();
    });

    function positionBook() {
      if (!metaWorldPos) return;
      const sc = projectToScreen(metaWorldPos);
      if (!sc) return;
      const [sx, sy] = sc;
      const bw = bookOpen ? 320 : 120;
      const bh = bookOpen ? 200 : 170;
      const barClearance = document.getElementById("isolate-bar").classList.contains("visible") ? 120 : 16;
      const maxBottom = metaCanvas.height - barClearance;
      let cx = Math.max(bw / 2 + 8, Math.min(sx, metaCanvas.width - bw / 2 - 8));
      let cy = sy;
      cy = Math.max(bh / 2 + 50, cy);
      cy = Math.min(maxBottom - bh / 2, cy);
      bookPopup.style.left = cx + "px";
      bookPopup.style.top  = cy + "px";
    }

    function bookRafLoop() {
      if (!metaWorldPos) return;
      positionBook();
      metaRafId = requestAnimationFrame(bookRafLoop);
    }

    function clearAnnotation() {
      metaWorldPos = null;
      metaLines    = null;
      if (metaRafId) { cancelAnimationFrame(metaRafId); metaRafId = null; }
      ctx2d.clearRect(0, 0, metaCanvas.width, metaCanvas.height);
      // Instant hide — no animation on external dismiss
      bookPopup.classList.remove("visible");
      bookOpen = false;
      bookFlipper.classList.remove("flip-right");
      bookFlipper.style.display = "none";
      bookSpread.classList.remove("visible");
      spreadInner.classList.remove("open", "close");
      bookCover.style.display = "";
      bookCover.classList.remove("closing");
    }

    new NavCubePlugin(viewer, {
      canvasElement: document.getElementById("nav-cube"),
      color: "#2d3748",
      visible: true,
      cameraFly: true
    });

    const loader = new XKTLoaderPlugin(viewer);

    // ── State ─────────────────────────────────────────────────────────────────
    let selectedGuids  = [];   // ordered list of currently selected GUIDs
    let isolateNavIdx  = 0;    // which selected element is focused in isolate mode
    let isolateMode    = false;
    let pendingHighlight = null; // latest queued "highlight" message, coalesced per animation frame
    let highlightRAF     = null;
    let xrayOn         = false;

    // ── Parse URL params ──────────────────────────────────────────────────────
    const params        = new URLSearchParams(window.location.search);
    const rawGuids      = params.get("highlight") || "";
    const highlightGuids = rawGuids ? rawGuids.split(",").map(s => s.trim()).filter(Boolean) : [];

    // ── Load task→GUID map ────────────────────────────────────────────────────
    let taskGuidMap = {};
    const taskGuidMapReady = fetch("./task_guid_map.json")
      .then(r => r.json())
      .then(data => { taskGuidMap = data; })
      .catch(() => {});

    // ── Load enriched per-element popup data ─────────────────────────────────
    let guidMetaMap = {};
    fetch("./guid_meta_map.json")
      .then(r => r.json())
      .then(data => { guidMetaMap = data; })
      .catch(() => {});

    // ── Load element metadata for grouping ───────────────────────────────────
    // guid → { apartment, floor, trade, phase, construction_type }
    let elementMeta = {};
    fetch("./element_metadata.csv")
      .then(r => r.text())
      .then(text => {
        function parseCSVLine(line) {
          const cols = []; let cur = ""; let inQ = false;
          for (let ci = 0; ci < line.length; ci++) {
            const ch = line[ci];
            if (ch === '"') { inQ = !inQ; }
            else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ""; }
            else { cur += ch; }
          }
          cols.push(cur.trim());
          return cols;
        }
        const lines = text.split("\n");
        const header = parseCSVLine(lines[0]);
        const idx = name => header.indexOf(name);
        const iGuid  = idx("Element_GUID");
        const iApt   = idx("Apartment");
        const iFloor = idx("Floor");
        const iTrade = idx("Trade");
        const iPhase = idx("Phase");
        const iCons  = idx("Construction_Type");
        for (let i = 1; i < lines.length; i++) {
          const cols = parseCSVLine(lines[i]);
          const guid = cols[iGuid];
          if (!guid) continue;
          elementMeta[guid] = {
            apartment:         cols[iApt]   || "",
            floor:             cols[iFloor] || "",
            trade:             cols[iTrade] || "",
            phase:             cols[iPhase] || "",
            construction_type: cols[iCons]  || "",
          };
        }
      })
      .catch(() => {});

    // ── Load model ────────────────────────────────────────────────────────────
    const model = loader.load({ id: "model", src: "./model.xkt", saoEnabled: true, edges: true });

    let totalObjects = 0;
    model.on("loaded", () => {
      // Wait for task_guid_map.json so __totalElements__ is available before
      // computing totalObjects — if model loads before the fetch resolves,
      // the fallback would use xeokit's smaller object count (~862) instead
      // of the correct element_metadata row count (3714), causing large
      // status filters to hit the "show all" early-return threshold.
      taskGuidMapReady.finally(() => {
        totalObjects = taskGuidMap.__totalElements__
          || Object.keys(viewer.scene.objects).length
          || viewer.scene.objectIds.length
          || 0;
        setStatus("");
        viewer.cameraFlight.flyTo({ aabb: viewer.scene.aabb, duration: 1 });
        window.parent.postMessage({ type: "ready", totalEntities: totalObjects }, "*");
        if (highlightGuids.length > 0) applyHighlight(highlightGuids, null);
      });
    });

    model.on("error", e => setStatus("Error loading model: " + e));

    // ── postMessage from Power BI ─────────────────────────────────────────────
    window.addEventListener("message", event => {
      const msg = event.data;
      if (!msg) return;
      if (msg.type === "highlight") {
        // Coalesce rapid-fire highlight messages (e.g. dragging a slicer
        // fires several update() calls within one frame) — only the latest
        // one actually needs to run; earlier ones would just be immediately
        // overwritten, so skip applying them at all.
        pendingHighlight = { guids: msg.guids || [], colorMap: msg.colorMap || null, animate: msg.animate === true };
        if (!highlightRAF) {
          highlightRAF = requestAnimationFrame(() => {
            highlightRAF = null;
            const h = pendingHighlight;
            pendingHighlight = null;
            // Resolve synthetic milestone GUIDs (MILESTONE_<Task_ID>) via task_guid_map
            let resolvedGuids = h.guids.includes("ALL") ? viewer.scene.objectIds : h.guids;
            if (resolvedGuids.some(g => g.startsWith("MILESTONE_"))) {
              const taskIds = resolvedGuids
                .filter(g => g.startsWith("MILESTONE_"))
                .map(g => g.replace("MILESTONE_", ""));
              const domainGuids = [...new Set(taskIds.flatMap(id => taskGuidMap[id] || []))];
              resolvedGuids = domainGuids.includes("ALL") ? viewer.scene.objectIds : domainGuids;
            }
            applyHighlight(resolvedGuids, h.colorMap, h.animate);
          });
        }
      } else if (msg.type === "taskSelected") {
        // Building/Site-level tasks (no specific location) are stored as a
        // single "ALL" sentinel instead of enumerating every element GUID —
        // was ~98.8% of task_guid_map.json's size. Expand it here against
        // whatever's actually loaded, instead of shipping ~18MB of JSON.
        const taskIds = (msg.taskIds || []).map(String);
        const rawGuids = [...new Set(taskIds.flatMap(id => taskGuidMap[id] || []))];
        const guids = rawGuids.includes("ALL") ? viewer.scene.objectIds : rawGuids;
        applyHighlight(guids, null, true);
      }
    });

    // ── Highlight (Power BI → 3D) ─────────────────────────────────────────────
    // XRAY_NON_SELECTED — true: ghost non-highlighted elements, false: show them normally. index.html ~line 302
    const XRAY_NON_SELECTED = false;
    function applyHighlight(guids, colorMap, animate) {
      clearAnnotation();

      if (guids.length === 0 || (totalObjects > 0 && guids.length >= totalObjects)) {
        if (selectedGuids.length > 0) {
          if (XRAY_NON_SELECTED) viewer.scene.setObjectsXRayed(selectedGuids, false);
          viewer.scene.setObjectsSelected(selectedGuids, false);
          viewer.scene.setObjectsPickable(selectedGuids, true);
          viewer.scene.setObjectsColorized(selectedGuids, false);
        }
        viewer.cameraFlight.flyTo({ aabb: viewer.scene.aabb, duration: 0.8 });
        selectedGuids = [];
        exitIsolateMode();
        setStatus(""); return;
      }

      const foundGuids = guids.filter(g => viewer.scene.objects[g]);

      // Clear all currently-selected objects (including any from group-nav clicks
      // which bypass selectedGuids tracking), then apply the new set cleanly.
      if (viewer.scene.selectedObjectIds.length > 0) {
        if (XRAY_NON_SELECTED) viewer.scene.setObjectsXRayed(viewer.scene.selectedObjectIds, false);
        viewer.scene.setObjectsColorized(viewer.scene.selectedObjectIds, false);
        viewer.scene.setObjectsSelected(viewer.scene.selectedObjectIds, false);
        viewer.scene.setObjectsPickable(viewer.scene.selectedObjectIds, true);
      }
      if (foundGuids.length > 0) {
        if (XRAY_NON_SELECTED) viewer.scene.setObjectsXRayed(foundGuids, false);
        viewer.scene.setObjectsSelected(foundGuids, true);
        viewer.scene.setObjectsPickable(foundGuids, true);
      }

      if (colorMap) {
        let minVal = Infinity, maxVal = -Infinity;
        for (const v of Object.values(colorMap)) { if (v < minVal) minVal = v; if (v > maxVal) maxVal = v; }
        for (const guid of foundGuids) {
          if (colorMap[guid] == null || maxVal <= minVal) continue;
          const t = (colorMap[guid] - minVal) / (maxVal - minVal);
          viewer.scene.objects[guid].colorize = [t, 1 - t, 0];
        }
      }

      const found = foundGuids.length;

      if (found > 0) {
        // Only compute the combined AABB (an O(found) scan) when we're
        // actually about to fly the camera there — skip it entirely
        // otherwise, and use xeokit's own bulk getAABB when available rather
        // than a hand-rolled per-object loop.
        if (animate) {
          const aabb = typeof viewer.scene.getAABB === "function"
            ? viewer.scene.getAABB(foundGuids)
            : foundGuids.reduce((bb, g) => {
                const a = viewer.scene.objects[g].aabb;
                bb[0] = Math.min(bb[0], a[0]); bb[1] = Math.min(bb[1], a[1]); bb[2] = Math.min(bb[2], a[2]);
                bb[3] = Math.max(bb[3], a[3]); bb[4] = Math.max(bb[4], a[4]); bb[5] = Math.max(bb[5], a[5]);
                return bb;
              }, [Infinity, Infinity, Infinity, -Infinity, -Infinity, -Infinity]);
          // SAO (ambient occlusion) and edge rendering are expensive per-frame
          // post-process passes — not worth paying for during the ~48 frames
          // of a fast camera flight where the camera is moving too quickly to
          // notice anyway. Suspend them for the flight, restore on completion.
          const wasSAO   = viewer.scene.sao.enabled;
          const wasEdges = viewer.scene.edges;
          viewer.scene.sao.enabled = false;
          viewer.scene.edges = false;
          viewer.cameraFlight.flyTo({ aabb, duration: 0.8 }, () => {
            viewer.scene.sao.enabled = wasSAO;
            viewer.scene.edges = wasEdges;
          });
        }
        setStatus(`${found} element${found !== 1 ? "s" : ""} highlighted`);
        selectedGuids = foundGuids;
        isolateNavIdx = 0;
        if (foundGuids.length > GROUP_THRESHOLD) {
          const built = buildGroups(foundGuids);
          pendingGroups = built || null;
          groupMode  = false;
          zoomedIn   = false;
          groups     = [];
          isolateMode = false;
          exitGroupNav();
          if (built) {
            // Show "See groups" button in toolbar; arrows hidden until user clicks it
            document.getElementById("btn-see-groups").style.display = "";
            document.getElementById("btn-see-groups").textContent = "See groups";
          } else {
            // >threshold but no grouping possible → normal arrow nav
            isolateMode = true;
            showIsolateNav();
          }
        } else if (foundGuids.length > 1) {
          groupMode = false;
          pendingGroups = null;
          exitGroupNav();
          isolateMode = true;
          showIsolateNav();
        } else {
          pendingGroups = null;
          exitGroupNav();
          exitIsolateMode();
        }
      } else {
        selectedGuids = [];
        setStatus("No matches in model");
      }
      window.parent.postMessage({ type: "highlightApplied", count: selectedGuids.length }, "*");
    }

    // ── Notify Power BI of selection ──────────────────────────────────────────
    function notifyPBI() {
      if (selectedGuids.length === 0) {
        window.parent.postMessage({ type: "selectionCleared" }, "*");
      } else {
        window.parent.postMessage({ type: "selectionChanged", guids: selectedGuids }, "*");
      }
    }

    // ── Click handler — click toggles element in/out of selection ────────────
    viewer.scene.input.on("mouseclicked", coords => {
      const hit = viewer.scene.pick({ canvasPos: coords });

      if (!hit) {
        if (!groupMode) clearSelection();
        return;
      }

      const guid = hit.entity.id;
      const idx  = selectedGuids.indexOf(guid);

      if (idx === -1) {
        // New element — add to selection
        selectedGuids.push(guid);
        hit.entity.selected = true;
      } else {
        // Same element — deselect
        selectedGuids.splice(idx, 1);
        hit.entity.selected = false;
      }

      const lastGuid = selectedGuids[0];
      setStatus(selectedGuids.length > 1
        ? `${selectedGuids.length} elements selected`
        : selectedGuids.length === 1
          ? `${viewer.metaScene?.metaObjects?.[lastGuid]?.type || "Element"} selected`
          : ""
      );

      // Don't wipe group mode on scene click — only exit if not in group browse
      if (!groupMode) exitIsolateMode();
      notifyPBI();
    });

    // ── Grouping logic ────────────────────────────────────────────────────────
    const GROUP_THRESHOLD = 10;
    const GROUP_ATTRS = ["apartment", "floor", "trade", "phase", "construction_type"];

    let groupMode      = false;  // true once user clicked "Browse groups"
    let pendingGroups  = null;   // built groups waiting for user to click Browse
    let groups         = [];     // [{label, guids}]
    let groupIdx       = 0;
    let zoomedIn       = false;  // true when inside a group scrolling elements
    let groupElemIdx   = 0;      // index within current group's elements when zoomedIn

    function buildGroups(guids) {
      // Try each attribute in hierarchy order; pick first that gives 2+ groups
      for (const attr of GROUP_ATTRS) {
        const buckets = {};
        for (const g of guids) {
          const val = elementMeta[g]?.[attr] || "";
          if (!val) continue;
          if (!buckets[val]) buckets[val] = [];
          buckets[val].push(g);
        }
        const keys = Object.keys(buckets);
        if (keys.length >= 2) {
          // Sort groups largest first
          keys.sort((a, b) => buckets[b].length - buckets[a].length);
          const label = attr.charAt(0).toUpperCase() + attr.slice(1).replace("_", " ");
          return keys.map(k => ({ label: `${label}: ${k}`, guids: buckets[k] }));
        }
      }
      return null; // no useful grouping found
    }

    function setGroupHighlight(idx) {
      // Use setObjectsSelected so selectedObjectIds stays accurate for applyHighlight's clear step
      if (viewer.scene.selectedObjectIds.length > 0)
        viewer.scene.setObjectsSelected(viewer.scene.selectedObjectIds, false);
      const guids = groups[idx].guids.filter(g => viewer.scene.objects[g]);
      if (guids.length > 0) viewer.scene.setObjectsSelected(guids, true);
      selectedGuids = guids;
    }

    function flyToGroup(idx) {
      setGroupHighlight(idx);
      const group = groups[idx];
      const aabb = typeof viewer.scene.getAABB === "function"
        ? viewer.scene.getAABB(group.guids)
        : group.guids.reduce((bb, g) => {
            const a = viewer.scene.objects[g]?.aabb;
            if (!a) return bb;
            bb[0] = Math.min(bb[0], a[0]); bb[1] = Math.min(bb[1], a[1]); bb[2] = Math.min(bb[2], a[2]);
            bb[3] = Math.max(bb[3], a[3]); bb[4] = Math.max(bb[4], a[4]); bb[5] = Math.max(bb[5], a[5]);
            return bb;
          }, [Infinity, Infinity, Infinity, -Infinity, -Infinity, -Infinity]);
      viewer.cameraFlight.flyTo({ aabb, duration: 0.8 });
      zoomedIn = false;
      updateNavLabel();
      updateIsolateBtn();
    }

    function zoomIntoGroup(idx, elemIdx) {
      const group = groups[idx];
      if (!group || group.guids.length === 0) return;
      elemIdx = elemIdx ?? 0;
      // Find a valid scene object starting from elemIdx (some GUIDs may not be in scene)
      let guid, obj;
      for (let i = 0; i < group.guids.length; i++) {
        const candidate = group.guids[(elemIdx + i) % group.guids.length];
        const o = viewer.scene.objects[candidate];
        if (o) { guid = candidate; obj = o; elemIdx = (elemIdx + i) % group.guids.length; break; }
      }
      if (!obj) return;
      groupElemIdx = elemIdx;
      viewer.cameraFlight.flyTo({ aabb: obj.aabb, duration: 0.8 });
      zoomedIn = true;
      updateNavLabel();
      updateIsolateBtn();
      try { showMeta(guid); } catch(e) { console.warn("showMeta error:", e); }
    }

    function updateIsolateBtn() {
      const btn = document.getElementById("btn-isolate");
      if (groupMode && zoomedIn)   btn.textContent = "Exit group";
      else if (groupMode)          btn.textContent = "See within group";
      else if (isolateMode)        btn.textContent = "Exit zoom";
      else                         btn.textContent = "Zoom to selected";
    }

    // ── Isolate selected (zoom in, show nav + metadata) ───────────────────────
    document.getElementById("btn-isolate").onclick = () => {
      if (selectedGuids.length === 0) return;
      if (groupMode) {
        if (zoomedIn) { clearAnnotation(); flyToGroup(groupIdx); }   // exit element nav → back to group nav
        else          { zoomIntoGroup(groupIdx, 0); }  // enter element nav
        return;
      }
      if (isolateMode) {
        // Already zoomed — fly back to full selection and reset button
        isolateMode = false;
        updateIsolateBtn();
        clearAnnotation();
        const aabb = selectedGuids.reduce((bb, g) => {
          const a = viewer.scene.objects[g]?.aabb;
          if (!a) return bb;
          bb[0] = Math.min(bb[0], a[0]); bb[1] = Math.min(bb[1], a[1]); bb[2] = Math.min(bb[2], a[2]);
          bb[3] = Math.max(bb[3], a[3]); bb[4] = Math.max(bb[4], a[4]); bb[5] = Math.max(bb[5], a[5]);
          return bb;
        }, [Infinity, Infinity, Infinity, -Infinity, -Infinity, -Infinity]);
        viewer.cameraFlight.flyTo({ aabb, duration: 0.8 });
        return;
      }
      isolateMode   = true;
      updateIsolateBtn();
      isolateNavIdx = 0;
      showIsolateNav();
      flyToSelected(isolateNavIdx);
    };

    document.getElementById("btn-see-groups").onclick = () => {
      if (groupMode) {
        // Exit groups → restore full selection and fly to combined AABB
        clearAnnotation();
        exitGroupNav();
        viewer.scene.setObjectsSelected(viewer.scene.selectedObjectIds, false);
        selectedGuids.forEach(g => { if (viewer.scene.objects[g]) viewer.scene.objects[g].selected = true; });
        const aabb = typeof viewer.scene.getAABB === "function"
          ? viewer.scene.getAABB(selectedGuids)
          : selectedGuids.reduce((bb, g) => {
              const a = viewer.scene.objects[g]?.aabb;
              if (!a) return bb;
              bb[0] = Math.min(bb[0], a[0]); bb[1] = Math.min(bb[1], a[1]); bb[2] = Math.min(bb[2], a[2]);
              bb[3] = Math.max(bb[3], a[3]); bb[4] = Math.max(bb[4], a[4]); bb[5] = Math.max(bb[5], a[5]);
              return bb;
            }, [Infinity, Infinity, Infinity, -Infinity, -Infinity, -Infinity]);
        viewer.cameraFlight.flyTo({ aabb, duration: 0.8 });
        document.getElementById("btn-see-groups").textContent = "See groups";
        updateIsolateBtn();
      } else {
        // Enter group mode
        if (!pendingGroups) return;
        groups    = pendingGroups;
        groupIdx  = 0;
        groupMode = true;
        zoomedIn  = false;
        // keep pendingGroups so re-entry works after exiting
        document.getElementById("btn-see-groups").textContent = "Exit groups";
        showGroupNav();
        flyToGroup(groupIdx);
        updateIsolateBtn();
      }
    };

    function exitGroupNav() {
      if (groups.length > 0) pendingGroups = groups; // preserve for re-entry
      groupMode = false;
      zoomedIn  = false;
      groups    = [];
      document.getElementById("nav-arrows").style.display = "none";
      document.getElementById("isolate-bar").classList.remove("visible");
    }

    function flyToSelected(idx) {
      const guid = selectedGuids[idx];
      const obj  = viewer.scene.objects[guid];
      if (!obj) return;
      viewer.cameraFlight.flyTo({ aabb: obj.aabb, duration: 0.8 });
      updateNavLabel();
      try { showMeta(guid); } catch(e) { console.warn("showMeta error:", e); }
    }

    function showGroupNav() {
      document.getElementById("isolate-bar").classList.add("visible");
      document.getElementById("nav-arrows").style.display = "inline-flex";
      updateNavLabel();
    }

    function showIsolateNav() {
      const bar = document.getElementById("isolate-bar");
      if (selectedGuids.length > 1) {
        bar.classList.add("visible");
        document.getElementById("nav-arrows").style.display = "inline-flex";
      } else {
        bar.classList.remove("visible");
      }
      updateIsolateBtn();
      updateNavLabel();
    }

    function updateNavLabel() {
      if (groupMode && zoomedIn && groups.length > 0) {
        const g = groups[groupIdx];
        document.getElementById("nav-label").textContent =
          `${groupElemIdx + 1} / ${g.guids.length}  (${g.label})`;
      } else if (groupMode && groups.length > 0) {
        const g = groups[groupIdx];
        document.getElementById("nav-label").textContent =
          `${groupIdx + 1} / ${groups.length}  (${g.label}, ${g.guids.length} el)`;
      } else {
        document.getElementById("nav-label").textContent =
          `${isolateNavIdx + 1} / ${selectedGuids.length}`;
      }
    }

    document.getElementById("nav-prev").onclick = () => {
      if (groupMode && zoomedIn) {
        const len = groups[groupIdx].guids.length;
        zoomIntoGroup(groupIdx, (groupElemIdx - 1 + len) % len);
      } else if (groupMode) {
        groupIdx = (groupIdx - 1 + groups.length) % groups.length;
        flyToGroup(groupIdx);
      } else {
        isolateNavIdx = (isolateNavIdx - 1 + selectedGuids.length) % selectedGuids.length;
        flyToSelected(isolateNavIdx);
      }
    };
    document.getElementById("nav-next").onclick = () => {
      if (groupMode && zoomedIn) {
        const len = groups[groupIdx].guids.length;
        zoomIntoGroup(groupIdx, (groupElemIdx + 1) % len);
      } else if (groupMode) {
        groupIdx = (groupIdx + 1) % groups.length;
        flyToGroup(groupIdx);
      } else {
        isolateNavIdx = (isolateNavIdx + 1) % selectedGuids.length;
        flyToSelected(isolateNavIdx);
      }
    };

    function exitIsolateMode() {
      isolateMode   = false;
      groupMode     = false;
      zoomedIn      = false;
      groups        = [];
      pendingGroups = null;
      document.getElementById("isolate-bar").classList.remove("visible");
      document.getElementById("nav-arrows").style.display = "none";
      document.getElementById("btn-see-groups").style.display = "none";
      document.getElementById("btn-see-groups").textContent = "See groups";
      updateIsolateBtn();
      clearAnnotation();
    }

    // ── Phase translation (Dutch → English) ──────────────────────────────────
    const PHASE_TRANSLATE = {
      'UITVOERING':    'Execution',
      'VOORBEREIDING': 'Preparation',
      'ONTWERP':       'Design',
      'OPLEVERING':    'Completion',
      'SLOOP':         'Demolition',
    };

    // ── Metadata label — projected to element centre in 3D space ────────────
    function showMeta(guid) {
      clearAnnotation();

      const meta = viewer.metaScene?.metaObjects?.[guid];
      const obj  = viewer.scene.objects[guid];
      if (!obj) return;

      // IFC props for external flag (still from xeokit)
      const props = {};
      (meta?.propertySets || []).forEach(ps =>
        (ps?.properties || []).forEach(p => { props[p?.name?.toLowerCase()] = p?.value; })
      );
      const externalVal = props["isexternal"] != null ? (props["isexternal"] ? "Yes" : "No") : "—";

      // Enriched data from guid_meta_map.json
      const em = guidMetaMap[guid] || {};
      const constructionType = em.Construction_Type || meta?.type?.replace(/^Ifc/, "") || "Element";
      const floor     = em.Floor     || "—";
      const apartment = em.Apartment || "Common Areas";

      // Phase with optional Dutch original
      const phaseRaw = em.Phase || "";
      const phaseEng = PHASE_TRANSLATE[phaseRaw] || phaseRaw;
      const showOriginalPhase = phaseRaw && phaseEng !== phaseRaw;

      const status   = em.Status            || "—";
      const trade    = em.Trade_Discipline  || "—";
      const respParty= em.Responsible_Party || "—";
      const duration = em.Duration          ? `${em.Duration} hrs` : "—";
      const weather  = em.Weather_Dependent || "—";
      const taskCount= em.Task_Match_Count  || "0";

      const budgeted = em.Budgeted_Cost_EUR ? `€${Math.round(parseFloat(em.Budgeted_Cost_EUR))}` : "—";
      const variance = em.Variance_EUR ? parseFloat(em.Variance_EUR) : null;
      let varianceLine = null;
      if (variance !== null && em.Budgeted_Cost_EUR) {
        const sign  = variance >= 0 ? "Over" : "Under";
        varianceLine = `${sign} budget: €${Math.abs(Math.round(variance))}`;
      }
      const payment = em.Payment_Status || "—";

      const row = (label, value) => (value && value !== "—" && value !== "0") ? [{ label, value }] : [];
      const sep = () => [{ label: "─────────────────", value: "" }];

      const schedRows = [
        ...row("Phase",    phaseEng),
        ...(showOriginalPhase ? [{ label: "", value: `(${phaseRaw})` }] : []),
        ...row("Status",   status),
        ...row("Type",     trade),
        ...(externalVal !== "—" ? [{ label: "External", value: externalVal }] : []),
        ...row("By",       respParty),
      ];
      const statRows = [
        ...row("Duration", duration),
        ...row("Weather",  weather),
        ...row("Tasks",    taskCount),
      ];
      const costRows = [
        ...row("Cost",     budgeted),
        ...(varianceLine ? [{ label: "", value: varianceLine }] : []),
        ...row("Payment",  payment),
      ];

      const aptLabel = (apartment && apartment !== "Common Areas") || em.Apartment === ""
        ? apartment : "Common Areas";

      buildBookPages({ constructionType, floor, apartment: aptLabel, schedRows, statRows, costRows });

      document.getElementById("cover-type").textContent  = constructionType;
      document.getElementById("cover-floor").textContent = `${floor} · ${aptLabel}`;

      const aabb = obj.aabb;
      metaWorldPos = [
        (aabb[0] + aabb[3]) / 2,
        (aabb[1] + aabb[4]) / 2,
        (aabb[2] + aabb[5]) / 2,
      ];

      // Show book cover after flyTo settles
      setTimeout(() => {
        bookOpen = false;
        bookFlipper.style.display = "none";
        bookSpread.classList.remove("visible");
        spreadInner.classList.remove("open", "close");
        bookCover.style.display = "";
        bookCover.classList.remove("closing");
        bookPopup.classList.add("visible");
        positionBook();
        bookRafLoop();
      }, 850);

      setStatus(`Showing: ${constructionType}`);
    }


    // ── Toolbar buttons ───────────────────────────────────────────────────────
    const clearPBI = () => window.parent.postMessage({ type: "selectionCleared" }, "*");

    function clearSelection() {
      viewer.scene.setObjectsSelected(viewer.scene.selectedObjectIds, false);
      selectedGuids = [];
      exitIsolateMode();
      setStatus("");
      clearPBI();
    }

    document.getElementById("btn-reset").onclick = () => {
      viewer.cameraFlight.flyTo({ aabb: viewer.scene.aabb });
      clearSelection();
    };

    document.getElementById("btn-xray").onclick = function () {
      xrayOn = !xrayOn;
      this.classList.toggle("active", xrayOn);
      viewer.scene.setObjectsXRayed(viewer.scene.objectIds, xrayOn);
      viewer.scene.setObjectsXRayed(viewer.scene.selectedObjectIds, false);
    };

    document.getElementById("btn-showall").onclick = () => {
      viewer.scene.setObjectsVisible(viewer.scene.objectIds, true);
      viewer.scene.setObjectsXRayed(viewer.scene.objectIds, false);
      viewer.scene.setObjectsSelected(viewer.scene.objectIds, false);
      exitIsolateMode();
      clearPBI();
      xrayOn = false;
      document.getElementById("btn-xray").classList.remove("active");
      clearSelection();
    };

    // ── Preset views ──────────────────────────────────────────────────────────
    // eye = look + CAM_D * (original_eye - look) — scales distance only, keeps centering
    const PRESETS = {
      overview: { eye: [-30*CAM_D,      10+30*CAM_D,  60*CAM_D],  look: [0, 10, 0],  up: [0,1,0] },
      front:    { eye: [0,              10+10*CAM_D,  80*CAM_D],  look: [0, 10, 0],  up: [0,1,0] },
      back:     { eye: [0,              10+10*CAM_D, -80*CAM_D],  look: [0, 10, 0],  up: [0,1,0] },
      left:     { eye: [-80*CAM_D,      10+10*CAM_D,  0],         look: [0, 10, 0],  up: [0,1,0] },
      right:    { eye: [80*CAM_D,       10+10*CAM_D,  0],         look: [0, 10, 0],  up: [0,1,0] },
      top:      { eye: [0,              100*CAM_D,    0.1],        look: [0,  0, 0],  up: [0,0,-1] },
      roof:     { eye: [-10*CAM_D,      35+20*CAM_D,  30*CAM_D],  look: [0, 35, 0],  up: [0,1,0] },
      ground:   { eye: [-20*CAM_D,      3+2*CAM_D,    40*CAM_D],  look: [0,  3, 0],  up: [0,1,0] },
    };

    document.getElementById("view-select").onchange = function() {
      const preset = PRESETS[this.value];
      if (!preset) return;
      viewer.cameraFlight.flyTo({ eye: preset.eye, look: preset.look, up: preset.up, duration: 1.2 });
      exitIsolateMode();
      clearPBI();
      this.value = "";
    };

    // ── Helpers ───────────────────────────────────────────────────────────────
    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }
  </script>
</body>
</html>
